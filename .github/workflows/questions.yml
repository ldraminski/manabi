name: Questions

on:
  push:
    paths: ['questions/**', 'scripts/questions.mjs']
  pull_request:
    paths: ['questions/**', 'scripts/questions.mjs']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run questions:check
